[versions]
agp = "8.8.0"
kotlin = "2.1.0"
compose = "1.7.6"
compose-material3 = "1.3.1"
androidx-activityCompose = "1.9.3"
androidx-lifecycle = "2.8.7"
androidx-camera = "1.4.1"
coroutines = "1.9.0"
playServicesLocation = "21.3.0"
mediapipe = "0.10.20"
litert = "0.19.1"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }

androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activityCompose" }
androidx-lifecycle-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "androidx-lifecycle" }
androidx-lifecycle-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }

compose-ui = { module = "androidx.compose.ui:ui", version.ref = "compose" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling", version.ref = "compose" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview", version.ref = "compose" }
compose-foundation = { module = "androidx.compose.foundation:foundation", version.ref = "compose" }
compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "compose-material3" }

camera-core = { module = "androidx.camera:camera-core", version.ref = "androidx-camera" }
camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "androidx-camera" }
camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "androidx-camera" }
camera-view = { module = "androidx.camera:camera-view", version.ref = "androidx-camera" }

play-services-location = { module = "com.google.android.gms:play-services-location", version.ref = "playServicesLocation" }

# Google MediaPipe Tasks GenAI (LLM Inference on-device)
mediapipe-tasks-genai = { module = "com.google.mediapipe:tasks-genai", version.ref = "mediapipe" }

# Google AI Edge / LiteRT-LM
litert-lm-runtime = { module = "com.google.ai.edge.litertlm:litertlm-android", version.ref = "litert" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
