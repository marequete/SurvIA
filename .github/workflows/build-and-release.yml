name: Build and Release SurvIA Native APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Required SDK Packages
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.11.1'

      - name: Build APK with Gradle 8.11.1
        run: |
          cd survia-app
          gradle :androidApp:assembleDebug --stacktrace
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

      - name: Rename APK for Distribution
        run: |
          mkdir -p release-output
          cp survia-app/androidApp/build/outputs/apk/debug/*.apk release-output/SurvIA.apk
          cp survia-app/assets/download-manifest.json release-output/download-manifest.json

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SurvIA-Android-APK
          path: release-output/SurvIA.apk

      - name: Publish to GitHub Releases (Tags)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release-output/SurvIA.apk
            release-output/download-manifest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
