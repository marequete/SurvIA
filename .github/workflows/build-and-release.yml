name: Build and Release SurvIA Native APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Required SDK Packages
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.11.1'

      - name: Prepare Release Keystore (if configured)
        id: keystore
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > /tmp/survia-release.jks
            echo "has_keystore=true" >> $GITHUB_OUTPUT
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret missing — falling back to assembleDebug"
            echo "has_keystore=false" >> $GITHUB_OUTPUT
          fi

      - name: Build APK with Gradle 8.11.1
        run: |
          cd survia-app
          if [ "${{ steps.keystore.outputs.has_keystore }}" = "true" ]; then
            gradle :androidApp:assembleRelease --stacktrace
          else
            gradle :androidApp:assembleDebug --stacktrace
          fi
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.has_keystore == 'true' && '/tmp/survia-release.jks' || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RELEASE_CERT_SHA256: ${{ secrets.RELEASE_CERT_SHA256 }}

      - name: Rename APK for Distribution
        run: |
          mkdir -p release-output
          if [ "${{ steps.keystore.outputs.has_keystore }}" = "true" ]; then
            cp survia-app/androidApp/build/outputs/apk/release/*-release.apk release-output/SurvIA.apk
          else
            cp survia-app/androidApp/build/outputs/apk/debug/*.apk release-output/SurvIA.apk
          fi
          cp survia-app/assets/download-manifest.json release-output/download-manifest.json

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SurvIA-Android-APK
          path: release-output/SurvIA.apk

      - name: Publish to GitHub Releases (Tags)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release-output/SurvIA.apk
            release-output/download-manifest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
