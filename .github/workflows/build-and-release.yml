name: Build and Release SurvIA Native APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Gradle Wrapper and Build APK
        run: |
          cd survia-app
          gradle wrapper --gradle-version 8.11.1
          ./gradlew :androidApp:assembleDebug --stacktrace

      - name: Rename APK for Distribution
        run: |
          mkdir -p release-output
          cp survia-app/androidApp/build/outputs/apk/debug/*.apk release-output/SurvIA.apk
          cp survia-app/assets/download-manifest.json release-output/download-manifest.json

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SurvIA-Android-APK
          path: release-output/SurvIA.apk

      - name: Publish to GitHub Releases (Tags)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release-output/SurvIA.apk
            release-output/download-manifest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
