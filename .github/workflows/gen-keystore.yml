name: Generate Release Keystore (one-shot)

on:
  workflow_dispatch:

jobs:
  gen-keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate RSA Keystore
        run: |
          keytool -genkeypair -v \
            -keystore survia-release.jks \
            -alias survia \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "SurvIA2024!Release" \
            -keypass "SurvIA2024!Release" \
            -dname "CN=SurvIA, OU=Android, O=SurvIA, L=Paris, ST=Ile-de-France, C=FR"

      - name: Extract SHA-256 of signing certificate
        run: |
          keytool -list -v \
            -keystore survia-release.jks \
            -alias survia \
            -storepass "SurvIA2024!Release" \
            | grep "SHA256:" \
            | sed 's/.*SHA256://' \
            | tr -d ' :' \
            | tr '[:upper:]' '[:lower:]' \
            > cert-sha256.txt
          echo "=== CERT SHA256 (no colons, lowercase) ==="
          cat cert-sha256.txt
          echo ""

      - name: Encode keystore as Base64
        run: |
          base64 survia-release.jks > survia-release-b64.txt
          echo "=== KEYSTORE BASE64 (first 60 chars) ==="
          head -c 60 survia-release-b64.txt
          echo ""

      - name: Upload keystore artifacts
        uses: actions/upload-artifact@v4
        with:
          name: survia-release-keystore
          path: |
            survia-release.jks
            survia-release-b64.txt
            cert-sha256.txt
          retention-days: 1
